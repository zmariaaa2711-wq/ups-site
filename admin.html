<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin UPS</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>


<header>

<div class="logo">

<img src="assets/herov1.jpeg" alt="Logo UPS">

</div>


<h1>ADMIN UPS</h1>


<p class="slogan">
Écouter → Agir → Rendre des comptes
</p>


</header>

<button id="logoutBtn">
Déconnexion
</button>



<section>


<h2>Espace administrateur</h2>


<p>
Bienvenue dans l'espace sécurisé UPS.
</p>

<div class="dashboard">

    <div class="card">
        <h3>Membres</h3>
        <p id="membersCount">0</p>
    </div>

    <div class="card">
        <h3>Signalements</h3>
        <p id="reportsCount">0</p>
    </div>

    <div class="card">
        <h3>Messages</h3>
        <p id="contactsCount">0</p>
    </div>

</div>

<h2>Membres inscrits</h2>

<div id="membersList">

Chargement...

</div>

<button id="loadMoreMembers">
Charger plus de membres
</button>




<h2>Signalements citoyens</h2>

<div id="reportsList">

Chargement...

</div>

<button id="loadMoreReports">
Charger plus de signalements
</button>




<h2>Messages de contact</h2>

<div id="contactsList">

Chargement...

</div>

<button id="loadMoreContacts">
Charger plus de messages
</button>



</section>




<script src="script.js"></script>


</body>

</html>
